services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calc}
      POSTGRES_DB: ${POSTGRES_DB:-calc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., target: migrator }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-calc}:${POSTGRES_PASSWORD:-calc}@db:5432/${POSTGRES_DB:-calc}
    depends_on:
      db: { condition: service_healthy }
    profiles: [app]

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-calc}:${POSTGRES_PASSWORD:-calc}@db:5432/${POSTGRES_DB:-calc}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    profiles: [app]

volumes:
  pgdata:
